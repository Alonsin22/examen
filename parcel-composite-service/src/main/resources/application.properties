spring.application.name=parcel-composite-service
server.port=8080

# HTTPS
server.ssl.enabled=true
server.ssl.key-store=classpath:ssl/huertos-keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SSL_PASSWORD:changeit}
server.ssl.key-alias=huertos

# Servicio base (sigue en HTTP)
parcel.service.url=http://localhost:8081